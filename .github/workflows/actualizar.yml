name: Auto-Actualizador de Loterías ALGORITMOM

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Configurar Entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Librerías de Scraping
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests

      - name: Ejecutar Scraper de Loterías
        run: python scraper.py

      - name: Confirmar y Guardar Cambios en GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sorteos.json
          git commit -m "Auto-actualización de sorteos: $(date +'%Y-%m-%d')" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
