name: Auto-Actualizador de Loterías ALGORITMOM

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Librerías de Scraping
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests

      - name: Ejecutar Scraper de Loterías
        run: python scraper.py

      - name: Guardar Cambios Automáticamente en GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Auto-actualización de sorteos diarios
          file_pattern: 'sorteos.json'
